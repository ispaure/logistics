[Launch]
# All relative paths in this file are resolved from the directory containing
# the project's small .sh/.command/.bat launcher files.
commonutils_root = Python/commonUtils
source_dir = Python

# Path relative to source_dir. Omit the .py extension.
# Nested paths are allowed, for example: tools/launch
launch_file = launch

# Optional. Creates this directory under the current user's home directory.
# Remove or leave empty for projects that do not need it.
ensure_user_dir = Server

# Pause after completed
pause_after_completed = false