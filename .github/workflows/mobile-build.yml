name: Native mobile prototype builds

on:
  push:
    branches: [alpha]
    paths: ['Python/logisticsmobile/**', 'Python/features/**', 'Python/services/**', 'Python/commonUtils', 'Python/commonUtils/**', 'Mobile/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:
    inputs:
      target:
        description: Native target to build
        required: true
        type: choice
        default: both
        options: [android, ios, both]
  workflow_call:
    inputs:
      target:
        type: string
        default: both

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Native ${{ matrix.target }} prototype
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'android' && '[{"target":"android","os":"ubuntu-24.04"}]' || inputs.target == 'ios' && '[{"target":"ios","os":"xcode-27"}]' || '[{"target":"android","os":"ubuntu-24.04"},{"target":"ios","os":"xcode-27"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.target == 'ios' && 110 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.2'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.9'
          cache-dependency-path: Mobile/rclone_bridge/go.sum
      - name: Select the SDK required for native Duo adaptation
        if: matrix.target == 'ios'
        run: python Mobile/select_ios_sdk.py --github-env "$GITHUB_ENV"
      - name: Prepare a clean, curated mobile payload
        run: |
          python -m pip install briefcase==0.4.5
          python Mobile/tools.py stage Mobile/payload
      - name: Generate and build the Android application
        if: matrix.target == 'android'
        working-directory: Mobile
        env:
          BRIEFCASE_HOME: ${{ runner.temp }}/briefcase
        run: |
          mkdir -p "$BRIEFCASE_HOME"
          python cloud_build.py licenses
          briefcase create android --no-input
          python cloud_build.py android
          briefcase build android --no-input
          cp build/logisticsmobile/android/gradle/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Logistics-android-debug.apk"
      - name: Generate and build the iOS Simulator application
        if: matrix.target == 'ios'
        working-directory: Mobile
        env:
          BRIEFCASE_HOME: ${{ runner.temp }}/briefcase
        run: |
          mkdir -p "$BRIEFCASE_HOME"
          xcodebuild -version
          xcrun simctl list devices available
          python cloud_build.py licenses
          briefcase create iOS --no-input
          python cloud_build.py ios
          briefcase build iOS --no-input
          app=$(find build/logisticsmobile/ios -type d -name 'Logistics Mobile.app' -print -quit)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/Logistics-ios-simulator.zip"
      - name: Exercise Android panels, rotation and safe areas
        if: matrix.target == 'android'
        working-directory: Mobile
        env:
          BRIEFCASE_HOME: ${{ runner.temp }}/briefcase
        run: |
          sudo chmod a+rw /dev/kvm
          python ui_tools.py run android --device '{"avd":"LogisticsValidation","device_type":"pixel","skin":null,"system_image":"system-images;android-35;google_apis;x86_64"}'
      - name: Exercise iPhone, iPad and Duo panels, rotation and safe areas
        if: matrix.target == 'ios'
        working-directory: Mobile
        env:
          BRIEFCASE_HOME: ${{ runner.temp }}/briefcase
        run: |
          device=$(python ui_tools.py ios-device)
          python ui_tools.py run ios --device "$device"
          cp logs/ios-native-ui.json logs/iphone-native-ui.json
          xcrun simctl shutdown "$device"
          device=$(python ui_tools.py ios-ipad)
          python ui_tools.py run ios --device "$device" --require-independent-windows
          cp logs/ios-native-ui.json logs/ipad-native-ui.json
          xcrun simctl shutdown "$device"
          device=$(python ui_tools.py ios-duo)
          python ui_tools.py run ios --device "$device" --require-duo
          cp logs/ios-native-ui.json logs/duo-native-ui.json
      - name: Capture iOS startup and crash diagnostics
        if: failure() && matrix.target == 'ios'
        working-directory: Mobile
        run: python ui_tools.py ios-diagnostics
      - name: Preserve native builds and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: logistics-native-${{ matrix.target }}
          path: |
            Mobile/payload/source.json
            Mobile/logs/
            ${{ runner.temp }}/Logistics-android-debug.apk
            ${{ runner.temp }}/Logistics-ios-simulator.zip
          retention-days: 14
