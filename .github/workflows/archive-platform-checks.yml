name: Application platform checks

on:
  pull_request:
    paths:
      - 'dev.py'
      - 'Python/**'
      - 'mobile_build/**'
      - '.github/**'
      - 'LaunchLogistics_*'
      - 'launch_config.ini'
      - 'Scripts/**'
  push:
    branches: [main, alpha]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: platform-checks-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.2'
      - run: python -m pip install ruff==0.14.0
      - run: python -m pip install --require-hashes -r mobile_build/requirements-host.txt
      - run: ruff check --config Python/pyproject.toml dev.py Python mobile_build Scripts .github/scripts
      - run: python dev.py architecture
      - run: python dev.py toolchain
      - run: python dev.py hygiene
      - name: Install the browser used by mobile DOM regressions
        run: |
          npm install --prefix "$RUNNER_TEMP/mobile-dom" --no-save --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/mobile-dom/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/mobile-dom/node_modules" >> "$GITHUB_ENV"
      - name: Check native mobile widget and picker contracts
        env:
          PYTHONPATH: .:Python
          TOGA_BACKEND: toga_dummy
        run: python Python/tests/run_regressions.py mobile_build/tests --isolate-modules
      - name: Check portable document core without desktop dependencies
        env:
          PYTHONPATH: Python
        run: python Python/tests/portable_documents.py
      - name: Check Unix launcher syntax
        run: bash -n LaunchLogistics_MAC.command LaunchLogistics_LINUX_UV.sh Python/commonUtils/launchers/LaunchPythonProject_LINUX_UV.sh

  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the historical public submodule for parity tests
        run: git -C Python/commonUtils fetch --no-tags origin 70117045020ee9a8f78c9e6ba3be47a9c7cd2ca6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.2'
      - name: Install headless Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libpulse0 fonts-dejavu-core
      - name: Test packaged Windows launcher and release tooling
        if: runner.os == 'Windows'
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Run all regressions and full before/after compression parity
        run: python Python/tests/run_platform_checks.py --install
        env:
          BROWSER_TEST_ARTIFACTS: ${{ runner.os == 'Windows' && 'test-results/browser-diagnostics' || '' }}
      - name: Collect native macOS crash diagnostics
        if: always() && runner.os == 'macOS'
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import time
          reports = Path.home() / 'Library/Logs/DiagnosticReports'
          output = Path('test-results/native')
          output.mkdir(parents=True, exist_ok=True)
          for report in reports.glob('*.ips'):
              if report.name.lower().startswith('python') and report.stat().st_mtime > time.time() - 3600:
                  shutil.copyfile(report, output / (report.name + '.log'))
          PY
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-checks-${{ matrix.os }}
          path: |
            test-results/**/*.json
            test-results/**/*.log
            test-results/browser-diagnostics/*.png
          retention-days: 14

  fedora43:
    name: Fedora 43 container
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the historical public submodule for parity tests
        run: git -C Python/commonUtils fetch --no-tags origin 70117045020ee9a8f78c9e6ba3be47a9c7cd2ca6
      - name: Run all checks inside Fedora 43
        run: docker run --rm -v "$PWD:/workspace" -w /workspace fedora:43 bash Python/tests/platform/fedora43.sh
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-checks-fedora43
          path: |
            test-results/**/*.json
            test-results/**/*.log
          retention-days: 14
