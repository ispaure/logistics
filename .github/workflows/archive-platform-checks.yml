name: Application platform checks

on:
  pull_request:
    paths:
      - 'Python/**'
      - '.github/**'
      - 'LaunchLogistics_*'
      - 'launch_config.ini'
      - 'Scripts/**'
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.2'
      - run: python -m pip install ruff==0.14.0
      - run: ruff check --config Python/pyproject.toml Python .github/scripts
      - name: Check Unix launcher syntax
        run: bash -n LaunchLogistics_MAC.command LaunchLogistics_LINUX_UV.sh Python/commonUtils/launchers/LaunchPythonProject_LINUX_UV.sh

  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the historical public submodule for parity tests
        run: git -C Python/commonUtils fetch --no-tags origin 70117045020ee9a8f78c9e6ba3be47a9c7cd2ca6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.2'
      - name: Install headless Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libpulse0 fonts-dejavu-core
      - name: Run all regressions and full before/after compression parity
        run: python Python/tests/run_platform_checks.py --install
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-checks-${{ matrix.os }}
          path: |
            test-results/**/*.json
            test-results/**/*.log
          retention-days: 14

  fedora43:
    name: Fedora 43 container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the historical public submodule for parity tests
        run: git -C Python/commonUtils fetch --no-tags origin 70117045020ee9a8f78c9e6ba3be47a9c7cd2ca6
      - name: Run all checks inside Fedora 43
        run: docker run --rm -v "$PWD:/workspace" -w /workspace fedora:43 bash Python/tests/platform/fedora43.sh
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-checks-fedora43
          path: |
            test-results/**/*.json
            test-results/**/*.log
          retention-days: 14
