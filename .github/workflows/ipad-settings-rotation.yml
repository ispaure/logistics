name: Hosted iPad Settings rotation diagnosis

on:
  push:
    branches: [codex/hosted-ipad-rotation]

permissions:
  contents: read
  actions: read

jobs:
  environment:
    uses: ./.github/workflows/test-environment.yml

  ios-ui:
    name: Compare Settings rotation (${{ matrix.mode }})
    needs: environment
    runs-on: ${{ needs.environment.outputs.ios_runner }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        mode: [warm]
    defaults:
      run:
        shell: bash
        working-directory: mobile_build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Save the updated host-side evidence collector
        run: cp validation/hosted_settings_rotation.py "$RUNNER_TEMP/hosted_settings_rotation.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a0da84d03e435bf54c8f0a212af8e37a3f5ae2d8
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.environment.outputs.python_version }}
      - name: Install explicitly pinned external manager
        working-directory: ${{ github.workspace }}
        run: python logistics_build/install_build_manager.py --from-pin "${{ runner.temp }}/build-deployment-manager"
      - name: Validate test source structure before native preparation
        working-directory: ${{ github.workspace }}
        run: python dev.py test-structure
      - name: Prepare the same SDK and simulator family as the build
        timeout-minutes: 30
        run: python select_ios_sdk.py --github-env "$GITHUB_ENV" --prepare-duo
      - run: python -m pip install briefcase==0.4.5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 43871023058
          name: logistics-ios-test-project
          path: ${{ runner.temp }}/ios-test-project
      - name: Restore the shared test application
        run: tar -xzf "$RUNNER_TEMP/ios-test-project/Logistics-ios-test-project.tar.gz"
      - name: Exercise Settings rotation
        env:
          PROBE_MODE: ${{ matrix.mode }}
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          device=$(python validation/ui_tools.py ios-ipad --owned)
          PYTHONPATH="$PWD/validation" python "$RUNNER_TEMP/hosted_settings_rotation.py" "$device" "$PROBE_MODE"
      - name: Remove the owned diagnostic iPad
        if: always()
        run: python validation/ui_tools.py ios-cleanup
      - name: Preserve rotation traces and crash reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ipad-settings-rotation-${{ matrix.mode }}
          path: |
            mobile_build/payload/source.json
            mobile_build/logs/
          retention-days: 14
