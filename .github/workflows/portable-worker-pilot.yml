name: Windows and Fedora portable worker pilot

on:
  push:
    branches: [codex/windows-fedora-test-workers]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          architecture: x64
          python-version: '3.12.2'
      - name: Install the pinned dependencies
        env:
          LOGISTICS_MANAGER_CHECKOUT: ${{ runner.temp }}/build-deployment-manager
        run: |
          python logistics_build/install_build_manager.py --from-pin "${{ runner.temp }}/build-deployment-manager"
          python Python/tests/run_platform_checks.py --install --prepare-only
      - run: python Python/tests/platform/worker_pilot.py --output test-results/worker-pilot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: portable-worker-pilot-windows
          path: test-results/worker-pilot
          retention-days: 14

  fedora:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: Python/tests/platform
          file: Python/tests/platform/fedora.Containerfile
          build-args: FEDORA_IMAGE=fedora:44
          load: true
          tags: logistics-fedora-tests:local
          cache-from: type=gha,scope=fedora-tests-${{ runner.arch }}
      - name: Run the pilot in Fedora
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace logistics-fedora-tests:local bash -euc '
            scratch=$(mktemp -d)
            uv venv --python 3.12.2 --seed "$scratch/environment"
            python="$scratch/environment/bin/python"
            git config --global --add safe.directory /workspace
            git config --global --add safe.directory /workspace/Python/commonUtils
            export LOGISTICS_MANAGER_CHECKOUT="$scratch/manager"
            "$python" logistics_build/install_build_manager.py --from-pin "$LOGISTICS_MANAGER_CHECKOUT"
            "$python" Python/tests/run_platform_checks.py --install --prepare-only
            "$python" Python/tests/platform/worker_pilot.py --output test-results/worker-pilot
          '
      - name: Return reports to the runner
        if: always()
        run: |
          if [ -d test-results ] && [ ! -L test-results ]; then
            sudo chown -R --no-dereference "$(id -u):$(id -g)" test-results
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: portable-worker-pilot-fedora
          path: test-results/worker-pilot
          retention-days: 14
