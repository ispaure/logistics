name: Browser presentation diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: Python
      BROWSER_TEST_ARTIFACTS: browser-diagnostics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.2'
      - run: python -m pip install PySide6==6.6.2 numpy==1.26.4 psutil send2trash pygments requests pillow
      - run: python Python/tests/run_regressions.py Python/commonUtils/tests --pattern test_browser_presentation.py
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-diagnostics
          path: browser-diagnostics
