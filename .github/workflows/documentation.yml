name: Documentation contracts
on:
  pull_request:
    paths: ['docs/**', 'README.md', 'AGENTS.md', 'Python/features/**', 'Python/ui_new/**', 'Python/commonUtils', 'Python/tests/test_documentation_layout.py', '.github/workflows/documentation.yml']
  push:
    branches: [main, alpha]
    paths: ['docs/**', 'README.md', 'AGENTS.md', 'Python/features/**', 'Python/ui_new/**', 'Python/commonUtils', 'Python/tests/test_documentation_layout.py', '.github/workflows/documentation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.2'
      - name: Check documentation ownership, hierarchy and links
        env:
          PYTHONPATH: Python
        run: python -m unittest discover -s Python/tests -p test_documentation_layout.py -v
