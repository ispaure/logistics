<header><div id="title"></div><div class="row">
<select id="tool" aria-label="Brush"></select><select id="color" aria-label="Ink color"></select><label>Width <select id="width" aria-label="Stroke width"></select></label>
<select id="layer" aria-label="Layer"></select><button id="erase">Erase</button><button id="select">Select / move</button>
<button data-action="undo" id="undo" onclick="send({op:'undo'})">Undo</button><button data-action="redo" id="redo" onclick="send({op:'redo'})">Redo</button></div>
<div class="row"><button id="prev">‹</button><span id="pageinfo"></span><button id="next">›</button><button data-action="add-page" onclick="send({op:'add-page'})">＋ Page</button><button data-action="save" onclick="send({op:'save'})">Save</button><button data-action="save-as" onclick="send({op:'save-as'})">Save As…</button><button data-action="export" onclick="send({op:'export'})">Export .rmdoc</button><button data-action="library" onclick="send({op:'library'})">Documents</button></div>
<details><summary>Page and drawing options</summary><div class="row"><label>Layer name <input id="layerName" maxlength="80" value="New layer"></label><button data-action="add-layer" id="addLayer" onclick="send({op:'add-layer',name:$('layerName').value})">Add layer</button><select id="layerVisibility" aria-label="Layer visibility"></select><button onclick="let row=state.layers.find(x=>x[0]===$('layerVisibility').value);if(row)send({op:'layer-visible',layer:row[0],visible:!row[2]})">Show / hide layer</button><button data-action="duplicate-page" onclick="send({op:'duplicate-page'})">Duplicate page</button><button data-action="delete-page" onclick="if(confirm('Delete this page? Undo is available.'))send({op:'delete-page'})">Delete page</button><button data-action="move-page-earlier" onclick="send({op:'move-page',index:Math.max(0,state.index-1)})">Move earlier</button><button data-action="move-page-later" onclick="send({op:'move-page',index:Math.min(state.count-1,state.index+1)})">Move later</button><button data-action="transfer" onclick="send({op:'transfer'})">Copy page to notebook…</button></div><div class="row"><label><input type="checkbox" id="finger"> Draw with finger</label><label><input type="checkbox" id="grayscale"> Grayscale preview (older models)</label><label>Zoom <select id="zoom"><option value="fit">Fit</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><label>Notebook name <input id="notebookName" maxlength="120"></label><button data-action="rename" id="renameNotebook" onclick="send({op:'rename',name:$('notebookName').value})">Rename</button></div></details><div id="status" role="status">Saved on this device. Export a copy to share.</div></header>
