<header aria-label="Drawing toolbar">
<div class="toolbar-group" aria-label="Edit history"><button id="undo" class="icon-button" data-icon="undo" title="Undo" aria-label="Undo" onclick="send({op:'undo'})"></button><button id="redo" class="icon-button" data-icon="redo" title="Redo" aria-label="Redo" onclick="send({op:'redo'})"></button></div>
<div class="separator"></div><div class="toolbar-group" role="group" aria-label="Drawing modes"><button id="ink" class="icon-button active" data-icon="pen" title="Draw (B)" aria-label="Draw" aria-pressed="true"></button><button id="erase" class="icon-button" data-icon="erase" title="Erase whole strokes (E)" aria-label="Erase whole strokes" aria-pressed="false"></button><button id="select" class="icon-button" data-icon="select" title="Select and move (V)" aria-label="Select and move" aria-pressed="false"></button></div>
<div class="separator"></div><select id="tool" class="hidden-control" aria-label="Brush" tabindex="-1"></select><div id="brushes" class="toolbar-group" role="group" aria-label="Brushes"></div>
<div class="separator"></div><select id="width" class="hidden-control" aria-label="Stroke width" tabindex="-1"></select><div id="widths" class="toolbar-group" role="group" aria-label="Stroke width presets"></div>
<details class="tool-popup" id="inkOptions"><summary title="Ink color" aria-label="Ink color"><span id="inkDot"></span><span>Ink</span></summary><div class="popup-panel"><div class="popup-heading">Ink color <span id="colorName" class="hint"></span></div><select id="color" class="hidden-control" aria-label="Ink color" tabindex="-1"></select><div id="swatches" role="group" aria-label="Ink colors"></div></div></details>
<div class="toolbar-spacer"></div><div class="toolbar-group layer-group"><span data-icon="layers" title="Active layer"></span><select id="layer" aria-label="Active layer"></select><details class="tool-popup" id="layerOptions"><summary title="Manage layers" aria-label="Manage layers"></summary><div class="popup-panel"><div class="popup-heading">Layers</div><label>Layer name <input id="layerName" maxlength="80" value="New layer"></label><button id="addLayer" onclick="send({op:'add-layer',name:$('layerName').value})">Add layer</button><label>Layer visibility <select id="layerVisibility" aria-label="Layer visibility"></select></label><button onclick="let row=state.layers.find(x=>x[0]===$('layerVisibility').value);if(row)send({op:'layer-visible',layer:row[0],visible:!row[2]})">Show / hide layer</button></div></details></div>
<div hidden><div id="title"></div><input id="notebookName" maxlength="120"><button id="renameNotebook" onclick="send({op:'rename',name:$('notebookName').value})"></button><input id="grayscale" type="checkbox"><input id="finger" type="checkbox"><button id="focus"></button></div>
</header>
<footer><div id="status" role="status">Not saved yet</div><span id="toolHint"></span><div class="page-controls" aria-label="Pages"><button id="prev" class="icon-button" data-icon="prev" title="Previous page (Alt+Left)" aria-label="Previous page"></button><span id="pageinfo"></span><button id="next" class="icon-button" data-icon="next" title="Next page (Alt+Right)" aria-label="Next page"></button><button id="addPage" class="icon-button" data-icon="plus" title="Add page" aria-label="Add page" onclick="send({op:'add-page'})"></button></div><label class="zoom-label"><span>Zoom</span><select id="zoom" aria-label="Zoom"><option value="page" selected>Fit page</option><option value="fit">Fit width</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label></footer>
