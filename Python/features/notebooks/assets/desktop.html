<header aria-label="Drawing toolbar">
<div class="toolbar-group" aria-label="Edit history"><button id="undo" class="icon-button" data-icon="undo" title="Undo" aria-label="Undo" onclick="send({op:'undo'})"></button><button id="redo" class="icon-button" data-icon="redo" title="Redo" aria-label="Redo" onclick="send({op:'redo'})"></button></div>
<div class="separator"></div><div class="toolbar-group" role="group" aria-label="Drawing modes"><button id="ink" class="icon-button active" data-icon="pen" title="Draw (B)" aria-label="Draw" aria-pressed="true"></button><button id="erase" class="icon-button" data-icon="erase" title="Eraser type and size (E)" aria-label="Eraser type and size" aria-pressed="false"></button><button id="select" class="icon-button" data-icon="select" title="Select and move (V)" aria-label="Select and move" aria-pressed="false"></button></div>
<div class="separator"></div><select id="tool" class="hidden-control" aria-label="Brush" tabindex="-1"></select><div id="brushes" class="toolbar-group" role="group" aria-label="Brushes"></div>
<div class="separator"></div><select id="width" class="hidden-control" aria-label="Stroke width" tabindex="-1"></select><div id="widths" class="toolbar-group" role="group" aria-label="Stroke width presets"></div>
<select id="color" class="hidden-control" aria-label="Ink color" tabindex="-1"></select><div id="swatches" class="toolbar-group" role="group" aria-label="Ink colors"></div>
<div class="toolbar-spacer"></div><div class="toolbar-group layer-group"><span data-icon="layers" title="Active layer"></span><select id="layer" aria-label="Active layer"></select><details class="tool-popup" id="layerOptions"><summary title="Manage layers" aria-label="Manage layers"></summary><div class="popup-panel"><div class="popup-heading">Layers</div><label>Layer name <input id="layerName" maxlength="80" value="New layer"></label><button id="addLayer" onclick="send({op:'add-layer',name:$('layerName').value})">Add layer</button><label>Layer visibility <select id="layerVisibility" aria-label="Layer visibility"></select></label><button onclick="let row=state.layers.find(x=>x[0]===$('layerVisibility').value);if(row)send({op:'layer-visible',layer:row[0],visible:!row[2]})">Show / hide layer</button></div></details></div>
<div hidden><div id="title"></div><input id="notebookName" maxlength="120"><button id="renameNotebook" onclick="send({op:'rename',name:$('notebookName').value})"></button><input id="grayscale" type="checkbox"><input id="finger" type="checkbox"><button id="focus"></button></div>
</header>
<footer><div id="status" role="status">Not saved yet</div><span id="toolHint"></span><button id="pagesOverview" title="Pages Overview" aria-haspopup="dialog">Pages Overview</button><div class="page-controls" aria-label="Pages"><button id="prev" class="icon-button" data-icon="prev" title="Previous page (Alt+Left)" aria-label="Previous page"></button><span id="pageinfo"></span><button id="next" class="icon-button" data-icon="next" title="Next page (Alt+Right)" aria-label="Next page"></button><button id="addPage" class="icon-button" data-icon="plus" title="Add Page after current page" aria-label="Add Page after current page" onclick="send({op:'add-page'})"></button></div><label class="zoom-label"><span>Zoom</span><select id="zoom" aria-label="Zoom"><option value="page" selected>Fit page</option><option value="fit">Fit width</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label></footer>
<dialog id="pagesDialog" aria-labelledby="pagesTitle">
<div class="overview-heading"><h2 id="pagesTitle">Pages Overview</h2><button id="closePages" autofocus>Close</button></div>
<div class="overview-actions"><span id="overviewCurrent"></span><button id="overviewAdd">Add Page after current page</button></div>
<p class="hint">Select a thumbnail to open a page. Ink previews may omit preserved templates and unsupported content.</p>
<div id="pagePreviews" role="group" aria-label="Page thumbnails"></div>
<button id="morePages">More pages</button><p id="overviewStatus" role="status"></p>
</dialog>
