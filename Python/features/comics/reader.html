<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:dark light;font:15px system-ui}body{margin:0;background:#202124;color:#eee}header{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#303134;flex-wrap:wrap}h1{font-size:15px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button{padding:7px 12px;cursor:pointer}button:disabled{cursor:default}#page{display:block;max-width:100%;max-height:calc(100vh - 100px);object-fit:contain;margin:auto}main{padding:16px;text-align:center}#seek{width:140px}#error{color:#ffb4ab}#direction{font-size:12px;color:#bbb}
</style>
<header><h1>{{TITLE}}</h1><span id="direction"></span><button id="previous">Previous</button><output id="progress" aria-live="polite"></output><button id="next">Next</button><input id="seek" type="range" min="1" value="1" aria-label="Go to page"></header>
<main><p id="error" hidden>Could not load this page. If the archive changed, reopen the reader.</p><img id="page" alt=""></main>
<script>
const count={{COUNT}}, rtl={{RTL}};
let current=0;
const image=document.getElementById('page'), progress=document.getElementById('progress'), seek=document.getElementById('seek'), previous=document.getElementById('previous'), next=document.getElementById('next'), error=document.getElementById('error');
seek.max=count;
document.getElementById('direction').textContent=rtl?'Right to left':'Left to right';
function go(page){current=Math.max(0,Math.min(count-1,page));error.hidden=true;image.alt=`Page ${current+1}`;image.src=`page/${current}`;seek.value=current+1;progress.textContent=`${current+1} / ${count} · ${Math.round((current+1)/count*100)}%`;previous.disabled=current===0;next.disabled=current===count-1;}
previous.onclick=()=>go(current-1);next.onclick=()=>go(current+1);seek.oninput=()=>go(Number(seek.value)-1);
image.onerror=()=>{error.hidden=false};
document.addEventListener('keydown',event=>{let target=current;if(event.key==='ArrowRight')target+=rtl?-1:1;else if(event.key==='ArrowLeft')target+=rtl?1:-1;else if(event.key==='ArrowDown')target++;else if(event.key==='ArrowUp')target--;else if(event.key==='Home')target=0;else if(event.key==='End')target=count-1;else return;event.preventDefault();go(target);});
go(0);
</script></html>
