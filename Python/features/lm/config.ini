[Chat]
# Show a system notification when an AI reply finishes.
response_notifications_bool = True
# Context size is manually set to match the loaded server model.
context_tokens_int = 8192
max_tokens_int = 1024
# Negative sampling values mean use the server default.
temperature_float = -1.0
top_p_float = -1.0
system_prompt_str = You are a helpful assistant.

[Connection]
# Inactivity timeout; increase for models with long initial loading/reasoning.
timeout_seconds_int = 180
