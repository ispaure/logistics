[project]
name = "logistics"
version = "0.1.3"
requires-python = "==3.12.2"
dependencies = [
    "certifi==2026.7.22",
    "Pillow==12.3.0",
    "PySide6==6.12.0",
    "pypdf==6.21.0",
    "markdown-it-py==4.2.0",
    "patool==4.0.5",
    "phue==1.1",
    "piexif==1.1.3",
    "pygments==2.19.2",
    "jedi==0.19.2",
    "pyzipper==0.4.0",
    "yt-dlp==2026.8.19",
]

[tool.uv]
constraint-dependencies = [
    "pycryptodomex==3.23.0",
]

[dependency-groups]
dev = ["ruff==0.14.0"]

[tool.ruff]
target-version = "py312"
exclude = ["features/emulation"]

[tool.ruff.lint]
# Start with correctness checks; formatting and legacy import cleanup are separate.
select = ["E9", "F63", "F7", "F82"]
