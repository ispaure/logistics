[project]
name = "logistics"
version = "0.1.15"
requires-python = "==3.12.2"
dependencies = [
    "certifi==2026.7.22",
    "Pillow==12.3.0",
    "PySide6==6.12.0",
    "pypdf==6.21.0",
    "markdown-it-py==4.2.0",
    "patool==4.0.5",
    "phue==1.1",
    "piexif==1.1.3",
    "pygments==2.19.2",
    "jedi==0.19.2",
    "pyzipper==0.4.0",
    "yt-dlp==2026.8.19",
]

[tool.uv]
constraint-dependencies = [
    "pycryptodomex==3.23.0",
]

[dependency-groups]
dev = ["ruff==0.14.0"]

[tool.ruff]
target-version = "py312"
# Retain Ruff's default cache/environment exclusions. These additional trees are
# generated or external, even in a checkout without Git ignore discovery.
extend-exclude = [
    "**/features/emulation",
    "**/mobile_build/build",
    "**/mobile_build/payload",
    "**/mobile_build/logs",
    "**/mobile_build/.deploy-workspaces",
    "**/mobile_build/.tools",
    "**/mobile_build/.briefcase",
    "**/mobile_build/.android-beta",
]

[tool.ruff.lint]
# Correctness checks plus reviewed duplicate-definition checks; compatibility
# exports and optional unused-binding diagnostics are reviewed separately.
select = ["E9", "F63", "F7", "F82", "F811"]
