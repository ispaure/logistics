[FeatureDefaults]
# Disabled features shipped by default. Personal feature choices override this.
disabled_list-str = ["aviation_tools", "blender", "dropbox", "emulation", "flight_sim", "fuse", "git", "ide", "links", "media", "minecraft", "perforce", "plex", "smart_home", "youtube_downloader"]

[DirectoryStructure]
server_path_win32 = Server
server_path_macos = Server
server_path_linux = Server
remote_network_mount_sub_path = NetworkMount
remote_local_sub_path = Local

[Folders]
excluded_remote_names = Dropbox,gdrive2
excluded_folder_name_suffixes = -PMSDATA

[FileIndex]
# New folders index their immediate contents. Refresh index scans the subtree.
scan_on_open = true
recursive_on_open = true
# Saved results open immediately; file-system notifications and Refresh update them.
refresh_cached_on_startup = true
refresh_on_revisit = false
watch_changes = false
background_priority = true

# Optional resource overrides, relative to the repository root or absolute.
# Defaults create Software/ and Credentials/rclone/ in the repository root.
# [Resources]
# software_path = Software
# credentials_path = Credentials/rclone
# Optional read-only provided Blender addon ZIP library (never created automatically).
# blender_addons_path = Addons/blender

[Updates]
# Offer tested, published GitHub releases from the selected channel in the hub.
enabled_bool = true
branch_mode = main
branch_choices_list-str = ["main", "beta", "alpha"]
