[tool.briefcase]
project_name = "Logistics Mobile"
bundle = "io.github.ispaure"
version = "0.1.9"
url = "https://github.com/ispaure/logistics"
license = "MIT"
author = "Marc-Andre Voyer"

[tool.briefcase.app.logisticsmobile]
build = "202610254"
formal_name = "Logistics Mobile"
description = "Native document workspaces, readers, LM chat and managed rclone copies"

# Keep the installed app identity; tools.py generates its launcher into the payload.
sources = ["payload/logisticsmobile", "payload/mobile", "payload/commonUtils", "payload/features", "payload/services"]
test_sources = ["native_tests/tests"]
requires = ["langdetect==1.0.9", "markdown-it-py==4.2.0", "pygments==2.19.2", "pypdf==6.21.0", "packaging==26.3"]

[tool.briefcase.app.logisticsmobile.macOS]
requires = ["toga-cocoa==0.5.7"]

[tool.briefcase.app.logisticsmobile.android]
version_code = 202610265
requires = ["toga-android==0.5.7"]
build_gradle_dependencies = [
    "com.google.android.material:material:1.12.0",
    "androidx.appcompat:appcompat:1.0.2",
    "androidx.constraintlayout:constraintlayout:1.1.3",
    "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0",
    "androidx.webkit:webkit:1.15.0",
    "com.onyx.android.sdk:onyxsdk-device:1.3.5.3",
    "com.onyx.android.sdk:onyxsdk-pen:1.5.8",
    "org.lsposed.hiddenapibypass:hiddenapibypass:4.3",
    "org.videolan.android:libvlc-all:3.7.5",
    "com.google.mlkit:genai-prompt:1.0.0-beta4",
]
build_gradle_extra_content = """
repositories { maven { url = uri("https://repo.boox.com/repository/maven-public/") } }
configurations.configureEach { exclude group: "com.android.support" }
android { packagingOptions { pickFirst "lib/*/libc++_shared.so" } }
android.sourceSets.main.java.srcDir(new File(rootProject.projectDir, "../../../../payload/mobile/android"))
chaquopy.defaultConfig.staticProxy("toga_android.widgets.internal.webview")
android.sourceSets.main.java.srcDir(new File(rootProject.projectDir, "../../../../payload/commonUtils/ui/native/android"))
android.sourceSets.main.java.srcDir(new File(rootProject.projectDir, "../../../../payload/features/books/mobile/android"))
android.sourceSets.main.java.srcDir(new File(rootProject.projectDir, "../../../../payload/features/notebooks/mobile/android"))
android.sourceSets.main.java.srcDir(new File(rootProject.projectDir, "../../../../payload/features/video/mobile/android"))
"""

[tool.briefcase.app.logisticsmobile.iOS]
min_os_version = "15.0"
requires = ["toga-iOS==0.5.7"]

[tool.briefcase.app.logisticsmobile.iOS.info]
UISupportedInterfaceOrientations = ["UIInterfaceOrientationPortrait", "UIInterfaceOrientationPortraitUpsideDown", "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
"UISupportedInterfaceOrientations~ipad" = ["UIInterfaceOrientationPortrait", "UIInterfaceOrientationPortraitUpsideDown", "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
CFBundleDisplayName = "Logisticks"
CFBundleName = "Logisticks"
UIFileSharingEnabled = true
LSSupportsOpeningDocumentsInPlace = true
NSCameraUsageDescription = "Capture photos immediately and take bursts from Home."
NSPhotoLibraryAddUsageDescription = "Save your burst camera photos directly to your Photos library."
NSLocalNetworkUsageDescription = "Connect to SMB file shares, your LM server and video casting receivers on your local network."

UIBackgroundModes = ["audio"]
